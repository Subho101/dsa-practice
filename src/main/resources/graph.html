<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Graph Visualizer</title>

        <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                height: 100vh;
                display: flex;
                font-family: Arial, sans-serif;
            }

            #sidebar {
                width: 320px;
                padding: 15px;
                border-right: 1px solid #ddd;
                background-color: #f8f9fa;
            }

            #graph {
                flex: 1;
                height: 100%;
            }

            h2 {
                margin-top: 0;
            }

            textarea {
                width: 100%;
                height: 320px;
                resize: vertical;
                padding: 10px;
                font-family: monospace;
            }

            select,
            button {
                width: 100%;
                margin-top: 10px;
                padding: 10px;
                font-size: 14px;
            }

            button {
                cursor: pointer;
            }

            .hint {
                margin-top: 15px;
                font-size: 13px;
                color: #666;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <div id="sidebar">
            <h2>Graph Visualizer</h2>

            <label for="graphType"><strong>Graph Type</strong></label>

            <select id="graphType" onchange="drawGraph()">
                <option value="undirected">Undirected</option>
                <option value="directed">Directed</option>
            </select>

            <br /><br />

            <label for="input"><strong>Edges</strong></label>

            <textarea id="input">
1 2
1 6
2 3
3 4
3 5
5 6
    </textarea
            >

            <button onclick="drawGraph()">Draw Graph</button>

            <div class="hint">
                Format:
                <pre>source destination</pre>

                Example:
                <pre>
1 2
1 6
2 3</pre
                >
            </div>
        </div>

        <div id="graph"></div>

        <script>
            let cy = null;

            function drawGraph() {
                const input = document.getElementById("input").value.trim();

                const graphType = document.getElementById("graphType").value;

                const nodes = new Set();

                const elements = [];

                let edgeCounter = 0;

                const lines = input.split("\n");

                for (const line of lines) {
                    const parts = line.trim().split(/\s+/);

                    if (parts.length < 2) {
                        continue;
                    }

                    const source = parts[0];
                    const target = parts[1];

                    nodes.add(source);
                    nodes.add(target);

                    elements.push({
                        data: {
                            id: "e" + edgeCounter++,
                            source: source,
                            target: target,
                        },
                    });
                }

                nodes.forEach((node) => {
                    elements.push({
                        data: {
                            id: node,
                            label: node,
                        },
                    });
                });

                if (cy) {
                    cy.destroy();
                }

                const edgeStyle =
                    graphType === "directed"
                        ? {
                              selector: "edge",
                              style: {
                                  width: 2,
                                  "line-color": "#666",
                                  "target-arrow-color": "#666",
                                  "target-arrow-shape": "triangle",
                                  "curve-style": "bezier",
                              },
                          }
                        : {
                              selector: "edge",
                              style: {
                                  width: 2,
                                  "line-color": "#666",
                              },
                          };

                cy = cytoscape({
                    container: document.getElementById("graph"),

                    elements: elements,

                    style: [
                        {
                            selector: "node",
                            style: {
                                label: "data(label)",
                                "background-color": "#4285F4",
                                color: "#ffffff",
                                "text-valign": "center",
                                "text-halign": "center",
                                "font-size": 14,
                                width: 40,
                                height: 40,
                            },
                        },

                        edgeStyle,
                    ],

                    layout: {
                        name: "cose",
                        animate: true,
                    },
                });
            }

            drawGraph();
        </script>
    </body>
</html>
